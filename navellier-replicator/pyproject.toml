[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navellier-replicator"
version = "0.1.0"
description = "Private single-subscriber signal-replication pipeline for a paid research source (paper-only, dry-run by default)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Hakan" }]

dependencies = [
    "playwright>=1.44",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
# Broker integration is v0.3 only. It is NEVER auto-installed and NEVER enables
# live trading. Paper mode is the only supported execution mode.
broker = [
    "ib_async>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
navellier-replicator = "navellier_replicator.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/navellier_replicator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that require live network/site access (skipped by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
