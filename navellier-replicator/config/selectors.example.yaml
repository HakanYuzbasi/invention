# CSS/text selectors for authenticated collection.
# Kept OUT of code so brittle selectors are config, not hardcoded.
# Copy to config/selectors.yaml and tune against the live site.
#
# The collector tries each selector in a list in order and uses the first
# match. First match must resolve to a UNIQUE element (Playwright fill/click is
# strict). InvestorPlace's /ipa-login/ renders TWO login forms (#pir_login_page
# and #pir_login_modal), so unscoped name=username/password would match 2+
# elements — selectors are scoped to the primary form #pir_login_page.

login:
  # Fields on the primary login form (#pir_login_page).
  username_candidates:
    - "#TAuserId"
    - "#pir_login_page input[name='username']"
    - "input[name='username']"
  password_candidates:
    - "#TApassword"
    - "#pir_login_page input[name='password']"
    - "input[name='password']"
  submit_candidates:
    - "#TAsubmitPage"
    - "#pir_login_page input[type='submit']"
  # Presence of ANY of these AFTER submit => still logged out (fail closed).
  # The primary-form password field is the most reliable logged-out signal.
  logged_out_markers:
    - "#TApassword"
    - "#pir_login_page"
  # Presence of ANY of these => logged in. (Unverified against the real
  # authenticated page; the min-content guard still backstops if wrong.)
  logged_in_markers:
    - "text=My Account"
    - "text=Sign Out"
    - "a[href*='logout']"
    - "a[href*='ipa-logout']"

portfolio:
  # Container(s) most likely to hold the holdings table.
  table_candidates:
    - "table.portfolio"
    - "table#holdings"
    - "table"
  # Column header text used to locate columns within a table (case-insensitive).
  header_hints:
    ticker: ["ticker", "symbol"]
    name: ["company", "name", "stock"]
    action: ["action", "status", "advice", "rating", "recommendation"]
  # Text markers that indicate the portfolio content actually rendered.
  content_markers:
    - "text=Portfolio"
    - "text=Buy Below"
    - "text=Holdings"
