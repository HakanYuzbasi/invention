[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-registry"
version = "0.3.0"
description = "Local-first prompt registry and evaluator: store, version, search, render, diff, and evaluate prompts as first-class assets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp>=1.2"]

[project.scripts]
prompt-registry = "prompt_registry.cli:entrypoint"
prompt-registry-mcp = "prompt_registry.mcp.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
